[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-task-validator"
version = "0.1.0"
description = "Validate SWE-bench-style coding tasks and review AI agent trajectories."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pytest>=7"]

[project.scripts]
swe-task-validator = "swe_task_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
